[package]
name = "bento"
version = "0.1.0"
edition = "2021"
description = "An educational Linux container runtime prototype written in Rust"
license = "MIT"

[[bin]]
name = "bento"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
